<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CET4 难度≥80% 的 951 个词自测：中英双向选择题，即时反馈、错题重练。">
<title>CET4 高频难词自测</title>
<style>
  :root{
    --bg:#faf8f4; --panel:#fffdf9; --ink:#20242b; --ink2:#4d5665; --ink3:#7a828e;
    --line:#e6e0d5; --line2:#f2ede3;
    --green:#1a6f5c; --green-bg:#e8f2ee;
    --blue:#274e7d; --blue-bg:#eaf0f7;
    --orange:#a4551f; --orange-bg:#fbf0e6;
    --red:#a33a3a; --red-bg:#fbeeee;
    --purple:#5c4383; --purple-bg:#f1ecf7;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171c; --panel:#1c1f26; --ink:#e7e9ee; --ink2:#aab1bd; --ink3:#848c9a;
      --line:#2e333d; --line2:#252932;
      --green:#4fc9a9; --green-bg:#16302a;
      --blue:#7aa5dc; --blue-bg:#1b2434;
      --orange:#e0904f; --orange-bg:#2e2218;
      --red:#e08a8a; --red-bg:#2c1c1c;
      --purple:#b195d9; --purple-bg:#251f31;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 26px}
  .mono{font-family:"JetBrains Mono","SF Mono",Consolas,monospace}

  header{padding:52px 0 26px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:800}
  h1{font-size:clamp(26px,4.4vw,36px);margin:.42em 0 .3em;font-weight:800;letter-spacing:-.015em;line-height:1.25}
  .lead{color:var(--ink2);font-size:15.5px;margin:0}

  /* 设置面板 */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:28px 30px;margin:32px 0 0}
  .field{margin-bottom:26px}
  .field:last-child{margin-bottom:0}
  .field > label{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink3); margin-bottom:12px}
  .opts{display:flex;flex-wrap:wrap;gap:10px}
  .opts button{font:inherit;font-size:14px;font-weight:650;padding:10px 18px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink2);cursor:pointer;
    transition:all .13s}
  .opts button:hover{border-color:var(--green);color:var(--green)}
  .opts button.on{background:var(--green);border-color:var(--green);color:#fff}
  .hint{font-size:13px;color:var(--ink3);margin:10px 0 0}
  .start{display:block;width:100%;margin-top:30px;padding:16px;font:inherit;font-size:16px;
    font-weight:800;letter-spacing:.02em;border:0;border-radius:12px;background:var(--green);
    color:#fff;cursor:pointer}
  .start:hover{filter:brightness(1.06)}
  .start:disabled{opacity:.4;cursor:not-allowed}

  /* 答题区 */
  .quiz{display:none;padding:30px 0 0}
  .quiz.on{display:block}
  .bar{display:flex;align-items:center;gap:16px;margin-bottom:8px}
  .bar .no{font-size:13px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
  .bar .sp{flex:1}
  .bar .score{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .bar .score b{color:var(--green);font-weight:800}
  .track{height:6px;border-radius:99px;background:var(--line2);overflow:hidden;margin-bottom:30px}
  .track i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}

  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:32px 34px}
  .qtag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--blue);margin-bottom:16px}
  .stem{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.4;margin:0 0 6px}
  .stem .blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--blue);
    color:var(--blue);text-align:center}
  .stemsub{font-size:14.5px;color:var(--ink3);margin:8px 0 0}

  .choices{display:grid;gap:12px;margin-top:26px}
  .choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;
    font-size:17px;font-weight:650;padding:16px 20px;border-radius:11px;
    border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;
    transition:all .13s}
  .choice:hover:not(:disabled){border-color:var(--green);background:var(--green-bg)}
  .choice:disabled{cursor:default}
  .choice .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--line2);
    color:var(--ink3);font-size:12.5px;font-weight:800;display:flex;align-items:center;
    justify-content:center;font-family:"JetBrains Mono",Consolas,monospace}
  .choice.right{border-color:var(--green);background:var(--green-bg)}
  .choice.right .k{background:var(--green);color:#fff}
  .choice.wrong{border-color:var(--red);background:var(--red-bg)}
  .choice.wrong .k{background:var(--red);color:#fff}
  .choice.dim{opacity:.5}

  .feedback{margin-top:24px;padding:20px 22px;border-radius:12px;display:none}
  .feedback.on{display:block}
  .feedback.ok{background:var(--green-bg);border-left:4px solid var(--green)}
  .feedback.no{background:var(--red-bg);border-left:4px solid var(--red)}
  .fbhead{font-size:15px;font-weight:800;margin:0 0 8px}
  .feedback.ok .fbhead{color:var(--green)}
  .feedback.no .fbhead{color:var(--red)}
  .fbdef{font-size:15px;color:var(--ink);margin:0}
  .fbctx{font-size:14.5px;color:var(--ink2);margin:12px 0 0;padding-top:12px;
    border-top:1px solid rgba(0,0,0,.07);line-height:1.95}
  .fbctx mark{background:transparent;color:var(--blue);font-weight:800;
    border-bottom:1.5px solid var(--blue);font-family:"JetBrains Mono",Consolas,monospace}

  .next{display:block;width:100%;margin-top:20px;padding:15px;font:inherit;font-size:15.5px;
    font-weight:800;border:0;border-radius:11px;background:var(--ink);color:var(--bg);cursor:pointer}
  .next:hover{filter:brightness(1.15)}

  /* 结果 */
  .result{display:none;padding:40px 0 0;text-align:center}
  .result.on{display:block}
  .big{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--green)}
  .big small{font-size:26px;color:var(--ink3);font-weight:700}
  .rlabel{font-size:15px;color:var(--ink3);margin:12px 0 0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:34px 0 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 12px}
  .stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
  .stat span{font-size:12.5px;color:var(--ink3)}
  .stat.g b{color:var(--green)} .stat.r b{color:var(--red)}
  .ractions{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
  .ractions button{flex:1;min-width:150px;padding:15px;font:inherit;font-size:15px;font-weight:800;
    border-radius:11px;cursor:pointer;border:1.5px solid var(--green);background:transparent;color:var(--green)}
  .ractions button.primary{background:var(--green);color:#fff}
  .ractions button:hover{filter:brightness(1.06)}

  .review{margin:44px 0 0;text-align:left}
  .review h2{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink3);margin:0 0 16px}
  .rv{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;margin-bottom:11px}
  .rv .w{font-size:18px;font-weight:800}
  .rv .pos{font-size:11.5px;font-weight:700;color:var(--purple);background:var(--purple-bg);
    padding:2px 7px;border-radius:5px;margin-left:8px;font-family:"JetBrains Mono",Consolas,monospace}
  .rv .d{font-size:14.5px;color:var(--ink2);margin:6px 0 0}
  .rv .c{font-size:13.5px;color:var(--ink3);margin:8px 0 0;line-height:1.85}
  .rv .c mark{background:transparent;color:var(--blue);font-weight:700;
    border-bottom:1px solid var(--blue);font-family:"JetBrains Mono",Consolas,monospace}

  footer{margin-top:56px;padding:24px 0 60px;border-top:1px solid var(--line);
    color:var(--ink3);font-size:13px;line-height:1.8}
  footer code{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;
    background:var(--line2);padding:1px 5px;border-radius:4px}

  @media(max-width:620px){
    .wrap{padding:0 17px}
    header{padding:38px 0 20px}
    .panel{padding:22px 20px}
    .qcard{padding:24px 20px}
    .stem{font-size:21px}
    .choice{font-size:15.5px;padding:14px 16px}
    .stats{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">CET4 · Self Test</div>
    <h1>高频难词自测</h1>
    <p class="lead" id="lead">从 951 个难度 ≥80% 的四级词中抽题，中英双向选择题，做完立刻看错题。</p>
  </header>

  <!-- 设置 -->
  <section id="setup">
    <div class="panel">
      <div class="field">
        <label>取词范围</label>
        <div class="opts" id="scope">
          <button data-v="all" class="on">全部 951</button>
          <button data-v="s1">#1–100</button>
          <button data-v="s2">#101–200</button>
          <button data-v="s3">#201–300</button>
          <button data-v="s4">#301–500</button>
          <button data-v="s5">#501–802</button>
          <button data-v="none">无词频</button>
          <button data-v="hard">最难 200</button>
        </div>
      </div>
      <div class="field">
        <label>题量</label>
        <div class="opts" id="count">
          <button data-v="20" class="on">20 题</button>
          <button data-v="50">50 题</button>
          <button data-v="100">100 题</button>
          <button data-v="0">全部</button>
        </div>
      </div>
      <div class="field">
        <label>题型</label>
        <div class="opts" id="mode">
          <button data-v="mixed" class="on">混合</button>
          <button data-v="cn2en">看语境选词</button>
          <button data-v="en2cn">看词选义</button>
        </div>
        <p class="hint" id="poolhint">可选词池：951 个</p>
      </div>
      <button class="start" id="start">开始自测</button>
    </div>
  </section>

  <!-- 答题 -->
  <section class="quiz" id="quiz">
    <div class="bar">
      <span class="no" id="qno">1 / 20</span>
      <span class="sp"></span>
      <span class="score">正确 <b id="qright">0</b> · 错误 <b id="qwrong">0</b></span>
    </div>
    <div class="track"><i id="prog"></i></div>
    <div class="qcard">
      <div class="qtag" id="qtag">看语境选词</div>
      <p class="stem" id="stem"></p>
      <p class="stemsub" id="stemsub"></p>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback">
        <p class="fbhead" id="fbhead"></p>
        <p class="fbdef" id="fbdef"></p>
        <p class="fbctx" id="fbctx"></p>
      </div>
      <button class="next" id="next" style="display:none">下一题</button>
    </div>
  </section>

  <!-- 结果 -->
  <section class="result" id="result">
    <div class="big" id="rscore">0<small>%</small></div>
    <p class="rlabel" id="rlabel"></p>
    <div class="stats">
      <div class="stat g"><b id="rright">0</b><span>答对</span></div>
      <div class="stat r"><b id="rwrong">0</b><span>答错</span></div>
      <div class="stat"><b id="rtotal">0</b><span>总题数</span></div>
    </div>
    <div class="ractions">
      <button class="primary" id="again">再来一轮</button>
      <button id="retry" style="display:none">只练错题</button>
    </div>
    <div class="review" id="review"></div>
  </section>

  <footer>
    <p><b>题目来源</b>：Anki 牌组 <code>deck:Cet4</code> 中 FSRS 难度 ≥80% 的 951 个词，按四级词频排序。</p>
    <p><b>出题逻辑</b>：「看语境选词」把中文语境句里的目标词挖空，四个选项为同难度附近的词；「看词选义」给英文词，四个选项为释义。</p>
    <p>页面自包含、无外部依赖，可离线使用；深色模式跟随系统。</p>
  </footer>
</div>

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 词池 ---------- */
const ALL = DATA.cards;
const ranked = ALL.filter(c=>c.rank).sort((a,b)=>a.rank-b.rank);
ranked.forEach((c,i)=>c._seq=i+1);
const bySeq = (lo,hi)=>ranked.filter(c=>c._seq>=lo&&c._seq<=hi);

const SCOPES = {
  all:  ()=>ALL.slice(),
  s1:   ()=>bySeq(1,100),
  s2:   ()=>bySeq(101,200),
  s3:   ()=>bySeq(201,300),
  s4:   ()=>bySeq(301,500),
  s5:   ()=>bySeq(501,802),
  none: ()=>ALL.filter(c=>!c.rank),
  hard: ()=>ALL.slice().sort((a,b)=>b.d-a.d).slice(0,200),
};

let cfg = { scope:'all', count:20, mode:'mixed' };
let queue = [], idx = 0, right = 0, wrong = 0, wrongList = [], locked = false;

function pool(){ return SCOPES[cfg.scope](); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- 干扰项 ---------- */
function decoys(ans, n, field){
  const pool = ALL.filter(c => c.w !== ans.w && c[field] && c[field] !== ans[field]);
  // 优先同词性、难度接近
  const near = pool.filter(c => c.pos === ans.pos);
  const base = near.length >= n*3 ? near : pool;
  const shuffled = shuffle(base);
  const out = [], seen = new Set([String(ans[field]).toLowerCase()]);
  for (const c of shuffled){
    const v = String(c[field]).toLowerCase();
    if (seen.has(v)) continue;
    seen.add(v); out.push(c);
    if (out.length === n) break;
  }
  return out;
}

/* ---------- 生成一题 ---------- */
function makeQ(c){
  const mode = cfg.mode === 'mixed' ? (Math.random() < .5 ? 'cn2en' : 'en2cn') : cfg.mode;
  if (mode === 'cn2en'){
    const haveCtx = !!c.ctx;
    const stemHTML = haveCtx
      ? esc(c.ctx).replace(new RegExp('(' + c.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\w*)','i'),
                           '<span class="blank">?</span>')
      : `${esc(c.def)}`;
    const subs = haveCtx ? '选出最合适的单词填入空处' : `释义：${esc(c.def)}　选出对应的单词`;
    const opts = shuffle([c, ...decoys(c, 3, 'w')]);
    return {
      word:c, mode, tag:'看语境选词',
      stem: stemHTML, sub: subs,
      choices: opts.map(o=>({key:o.w, ok:o.w===c.w})),
      answer: c.w,
    };
  } else {
    const opts = shuffle([c, ...decoys(c, 3, 'def')]);
    return {
      word:c, mode, tag:'看词选义',
      stem: `<span class="mono">${esc(c.w)}</span>`,
      sub: c.pos ? `词性：${esc(c.pos)}` : '',
      choices: opts.map(o=>({key:o.def, ok:o.w===c.w})),
      answer: c.def,
    };
  }
}

/* ---------- 流程 ---------- */
function start(list){
  const n = cfg.count === 0 ? list.length : Math.min(cfg.count, list.length);
  queue = shuffle(list).slice(0, n).map(makeQ);
  idx = 0; right = 0; wrong = 0; wrongList = [];
  $('#setup').style.display='none';
  $('#result').classList.remove('on');
  $('#quiz').classList.add('on');
  $('#qright').textContent = 0; $('#qwrong').textContent = 0;
  renderQ();
}

function renderQ(){
  locked = false;
  const q = queue[idx];
  if (!q){ showResult(); return; }
  $('#qno').textContent = `${idx+1} / ${queue.length}`;
  $('#prog').style.width = (idx / queue.length * 100) + '%';
  $('#qtag').textContent = q.tag;
  $('#stem').innerHTML = q.stem;
  $('#stemsub').textContent = q.sub;
  $('#feedback').className = 'feedback';
  $('#next').style.display = 'none';

  const box = $('#choices');
  box.innerHTML = '';
  q.choices.forEach((ch, i)=>{
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<span class="k">${'ABCD'[i]}</span><span>${esc(ch.key)}</span>`;
    b.addEventListener('click', ()=>answer(ch, b, q));
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function answer(ch, btn, q){
  if (locked) return;
  locked = true;
  const c = q.word;
  document.querySelectorAll('.choice').forEach(b=>b.disabled = true);

  if (ch.ok){
    btn.classList.add('right');
    right++;
    $('#fbhead').textContent = '✓ 答对了';
    $('#feedback').className = 'feedback on ok';
  } else {
    btn.classList.add('wrong');
    wrong++;
    wrongList.push(c);
    document.querySelectorAll('.choice').forEach((b,i)=>{
      if (q.choices[i].ok) b.classList.add('right');
      else if (b !== btn) b.classList.add('dim');
    });
    $('#fbhead').textContent = '✗ 正确答案：' + q.answer;
    $('#feedback').className = 'feedback on no';
  }

  $('#fbdef').textContent = (c.pos ? c.pos + ' ' : '') + (c.def || '');
  const ctx = c.ctx || '';
  $('#fbctx').innerHTML = ctx
    ? esc(ctx).replace(new RegExp('(' + c.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\w*)','i'), '<mark>$1</mark>')
    : '';
  $('#fbctx').style.display = ctx ? 'block' : 'none';

  $('#qright').textContent = right;
  $('#qwrong').textContent = wrong;
  $('#next').style.display = 'block';
  $('#next').textContent = idx === queue.length - 1 ? '查看成绩' : '下一题';
}

$('#next').addEventListener('click', ()=>{ idx++; renderQ(); });

function showResult(){
  $('#quiz').classList.remove('on');
  $('#result').classList.add('on');
  const total = right + wrong;
  const pct = total ? Math.round(right / total * 100) : 0;
  $('#rscore').innerHTML = `${pct}<small>%</small>`;
  $('#rright').textContent = right;
  $('#rwrong').textContent = wrong;
  $('#rtotal').textContent = total;
  $('#rlabel').textContent = pct >= 90 ? '很稳，这批词基本掌握了'
    : pct >= 75 ? '掌握得不错，错的那几个再过一遍'
    : pct >= 60 ? '还有一半没吃透，建议只练错题'
    : '基础还不牢，先把错题过两轮';

  const uniq = [];
  const seen = new Set();
  wrongList.forEach(c=>{ if(!seen.has(c.w)){ seen.add(c.w); uniq.push(c); } });
  $('#retry').style.display = uniq.length ? 'block' : 'none';
  $('#retry').textContent = `只练错题（${uniq.length}）`;

  $('#review').innerHTML = uniq.length ? '<h2>错题回顾</h2>' + uniq.map(c=>{
    const ctx = c.ctx ? esc(c.ctx).replace(new RegExp('(' + c.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\w*)','i'),'<mark>$1</mark>') : '';
    return `<div class="rv">
      <div><span class="w">${esc(c.w)}</span>${c.pos?`<span class="pos">${esc(c.pos)}</span>`:''}</div>
      <p class="d">${esc(c.def||'')}</p>
      ${ctx?`<p class="c">${ctx}</p>`:''}
    </div>`;
  }).join('') : '';
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- 设置交互 ---------- */
function bindGroup(sel, key, cb){
  $(sel).addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    [...$(sel).children].forEach(x=>x.classList.toggle('on', x===b));
    cfg[key] = key === 'count' ? +b.dataset.v : b.dataset.v;
    cb && cb();
  });
}
bindGroup('#scope','scope',()=>{
  $('#poolhint').textContent = `可选词池：${pool().length} 个`;
});
bindGroup('#count','count');
bindGroup('#mode','mode');

$('#start').addEventListener('click', ()=>start(pool()));
$('#again').addEventListener('click', ()=>{
  $('#result').classList.remove('on');
  $('#setup').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
});
$('#retry').addEventListener('click', ()=>{
  const uniq = []; const seen = new Set();
  wrongList.forEach(c=>{ if(!seen.has(c.w)){ seen.add(c.w); uniq.push(c); } });
  if (!uniq.length) return;
  const keep = cfg.count;
  cfg.count = 0;
  start(uniq);
  cfg.count = keep;
});

$('#poolhint').textContent = `可选词池：${pool().length} 个`;
$('#lead').textContent = `从 ${ALL.length} 个难度 ≥80% 的四级词中抽题，中英双向选择题，做完立刻看错题。`;
</script>
