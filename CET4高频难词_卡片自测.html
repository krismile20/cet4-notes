<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CET4 难度≥80% 951 词的卡片式自测：翻面看答案，自评掌握度，不认识的卡片循环重练。">
<title>CET4 高频难词 · 卡片自测</title>
<style>
  :root{
    --bg:#faf8f4; --panel:#fffdf9; --ink:#20242b; --ink2:#4d5665; --ink3:#7a828e;
    --line:#e6e0d5; --line2:#f2ede3;
    --green:#1a6f5c; --green-bg:#e8f2ee;
    --blue:#274e7d; --blue-bg:#eaf0f7;
    --orange:#a4551f; --orange-bg:#fbf0e6;
    --red:#a33a3a; --red-bg:#fbeeee;
    --purple:#5c4383; --purple-bg:#f1ecf7;
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171c; --panel:#1c1f26; --ink:#e7e9ee; --ink2:#aab1bd; --ink3:#848c9a;
      --line:#2e333d; --line2:#252932;
      --green:#4fc9a9; --green-bg:#16302a;
      --blue:#7aa5dc; --blue-bg:#1b2434;
      --orange:#e0904f; --orange-bg:#2e2218;
      --red:#e08a8a; --red-bg:#2c1c1c;
      --purple:#b195d9; --purple-bg:#251f31;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
  .wrap{max-width:780px;margin:0 auto;padding:0 26px}
  .mono{font-family:"JetBrains Mono","SF Mono",Consolas,monospace}

  header{padding:50px 0 24px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:800}
  h1{font-size:clamp(25px,4.2vw,34px);margin:.42em 0 .28em;font-weight:800;letter-spacing:-.015em;line-height:1.25}
  .lead{color:var(--ink2);font-size:15.5px;margin:0}

  /* ===== 设置 ===== */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:28px 30px;margin:30px 0 0}
  .field{margin-bottom:26px}
  .field:last-of-type{margin-bottom:0}
  .field > label{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink3);margin-bottom:12px}
  .opts{display:flex;flex-wrap:wrap;gap:9px}
  .opts button{font:inherit;font-size:14px;font-weight:650;padding:10px 17px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink2);cursor:pointer;transition:all .13s}
  .opts button:hover{border-color:var(--green);color:var(--green)}
  .opts button.on{background:var(--green);border-color:var(--green);color:#fff}
  .hint{font-size:13px;color:var(--ink3);margin:10px 0 0}
  .start{display:block;width:100%;margin-top:30px;padding:17px;font:inherit;font-size:16px;
    font-weight:800;border:0;border-radius:12px;background:var(--green);color:#fff;cursor:pointer}
  .start:hover{filter:brightness(1.06)}

  /* ===== 卡片区 ===== */
  .study{display:none;padding:26px 0 0}
  .study.on{display:block}
  .bar{display:flex;align-items:center;gap:14px;margin-bottom:9px}
  .bar .no{font-size:13px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
  .bar .sp{flex:1}
  .bar .cnt{display:flex;gap:14px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink3)}
  .bar .cnt b{font-weight:800}
  .bar .cnt .g b{color:var(--green)}
  .bar .cnt .o b{color:var(--orange)}
  .bar .cnt .r b{color:var(--red)}
  .track{height:6px;border-radius:99px;background:var(--line2);overflow:hidden;margin-bottom:26px}
  .track i{display:block;height:100%;background:var(--green);width:0;transition:width .35s}

  /* 卡片本体 */
  .card{position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:0;min-height:390px;
    display:flex;flex-direction:column;cursor:pointer;
    transition:border-color .15s, box-shadow .15s}
  .card:hover{border-color:var(--green)}
  .card.flipped{cursor:default}
  .card.flipped:hover{border-color:var(--line)}
  .cface{padding:34px 38px;flex:1;display:flex;flex-direction:column;justify-content:center}
  .ctag{position:absolute;top:18px;left:38px;font-size:10.5px;font-weight:800;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink3)}
  .ctag.blue{color:var(--blue)}

  /* 正面 */
  .front .zh{font-size:22px;line-height:2.0;font-weight:600;letter-spacing:-.005em;margin:0}
  .front .zh .blank{display:inline-block;min-width:130px;border-bottom:3px solid var(--blue);
    color:var(--blue);text-align:center;font-weight:800}
  .front .word{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:0;
    text-align:center;font-family:"JetBrains Mono",Consolas,monospace}
  .front .pos{margin:14px 0 0;text-align:center;font-size:15px;color:var(--ink3)}
  .reveal{margin-top:26px;text-align:center;font-size:13px;color:var(--ink3)}
  .reveal kbd{font-family:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:5px;
    padding:2px 7px;background:var(--line2);color:var(--ink2)}

  /* 背面 */
  .back .w{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:0}
  .back .w .pos{display:inline-block;vertical-align:middle;margin-left:11px;font-size:12px;
    font-weight:700;color:var(--purple);background:var(--purple-bg);padding:3px 9px;
    border-radius:6px;font-family:"JetBrains Mono",Consolas,monospace;letter-spacing:0}
  .back .def{font-size:19px;font-weight:650;color:var(--ink);margin:14px 0 0;line-height:1.7}
  .back .block{margin-top:18px;padding:14px 18px;border-radius:10px;font-size:14.5px;line-height:1.95}
  .back .block .lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    display:block;margin-bottom:6px}
  .memo{background:var(--green-bg);border-left:3px solid var(--green);color:var(--ink2)}
  .memo .lbl{color:var(--green)}
  .ctx{background:var(--blue-bg);border-left:3px solid var(--blue);color:var(--ink)}
  .ctx .lbl{color:var(--blue)}
  .ctx mark{background:transparent;color:var(--blue);font-weight:800;
    border-bottom:1.5px solid var(--blue);font-family:"JetBrains Mono",Consolas,monospace}
  .back .meta{margin-top:16px;font-size:12.5px;color:var(--ink3);display:flex;gap:16px;flex-wrap:wrap}
  .back .meta b{color:var(--ink2);font-weight:700}

  /* 评级按钮 */
  .grade{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
  .grade button{font:inherit;padding:17px 10px;border-radius:12px;cursor:pointer;
    border:1.5px solid;background:transparent;font-weight:800;font-size:15px;
    display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .13s}
  .grade button span{font-size:11px;font-weight:700;opacity:.7;letter-spacing:.04em}
  .grade .g1{color:var(--red);border-color:var(--red)}
  .grade .g1:hover{background:var(--red-bg)}
  .grade .g2{color:var(--orange);border-color:var(--orange)}
  .grade .g2:hover{background:var(--orange-bg)}
  .grade .g3{color:var(--green);border-color:var(--green)}
  .grade .g3:hover{background:var(--green-bg)}
  .grade[hidden]{display:none}

  /* ===== 结果 ===== */
  .result{display:none;padding:36px 0 0}
  .result.on{display:block}
  .rtop{text-align:center}
  .big{font-size:62px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--green)}
  .big small{font-size:24px;color:var(--ink3);font-weight:700}
  .rlabel{font-size:15px;color:var(--ink3);margin:11px 0 0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:30px 0 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 12px;text-align:center}
  .stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat span{font-size:12.5px;color:var(--ink3)}
  .stat.g b{color:var(--green)} .stat.o b{color:var(--orange)} .stat.r b{color:var(--red)}
  .ractions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
  .ractions button{flex:1;min-width:145px;padding:16px;font:inherit;font-size:15px;font-weight:800;
    border-radius:12px;cursor:pointer;border:1.5px solid var(--green);
    background:transparent;color:var(--green);transition:all .13s}
  .ractions button.primary{background:var(--green);color:#fff}
  .ractions button:hover{filter:brightness(1.06)}
  .review{margin:42px 0 0}
  .review h2{font-size:14px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink3);margin:0 0 15px}
  .rv{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:17px 21px;margin-bottom:11px;border-left:3px solid var(--red)}
  .rv .w{font-size:19px;font-weight:800}
  .rv .pos{font-size:11.5px;font-weight:700;color:var(--purple);background:var(--purple-bg);
    padding:2px 8px;border-radius:5px;margin-left:9px;font-family:"JetBrains Mono",Consolas,monospace}
  .rv .d{font-size:15px;color:var(--ink2);margin:7px 0 0}
  .rv .c{font-size:13.8px;color:var(--ink3);margin:9px 0 0;line-height:1.9}
  .rv .c mark{background:transparent;color:var(--blue);font-weight:700;
    border-bottom:1px solid var(--blue);font-family:"JetBrains Mono",Consolas,monospace}

  footer{margin-top:52px;padding:24px 0 56px;border-top:1px solid var(--line);
    color:var(--ink3);font-size:13px;line-height:1.85}
  footer code{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;
    background:var(--line2);padding:1px 5px;border-radius:4px}

  @media(max-width:620px){
    .wrap{padding:0 16px}
    header{padding:36px 0 18px}
    .panel{padding:22px 20px}
    .cface{padding:28px 22px}
    .ctag{left:22px}
    .front .word{font-size:40px}
    .front .zh{font-size:18.5px;line-height:1.95}
    .back .w{font-size:27px}
    .back .def{font-size:17px}
    .card{min-height:340px}
    .grade{gap:9px}
    .grade button{padding:14px 6px;font-size:14px}
    .stats{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">CET4 · Flashcards</div>
    <h1>高频难词 · 卡片自测</h1>
    <p class="lead" id="lead">翻面看答案，自评掌握度。不认识的卡片会重新排队，直到这轮过关。</p>
  </header>

  <section id="setup">
    <div class="panel">
      <div class="field">
        <label>取词范围</label>
        <div class="opts" id="scope">
          <button data-v="all" class="on">全部 951</button>
          <button data-v="s1">#1–100</button>
          <button data-v="s2">#101–200</button>
          <button data-v="s3">#201–300</button>
          <button data-v="s4">#301–500</button>
          <button data-v="s5">#501–802</button>
          <button data-v="none">无词频</button>
          <button data-v="hard">最难 200</button>
        </div>
      </div>
      <div class="field">
        <label>本轮题量</label>
        <div class="opts" id="count">
          <button data-v="20" class="on">20 张</button>
          <button data-v="50">50 张</button>
          <button data-v="100">100 张</button>
          <button data-v="0">全部</button>
        </div>
      </div>
      <div class="field">
        <label>卡片正面</label>
        <div class="opts" id="side">
          <button data-v="cn" class="on">中文语境挖空</button>
          <button data-v="en">英文单词</button>
          <button data-v="mix">混合</button>
        </div>
        <p class="hint" id="poolhint">可选词池：951 个</p>
      </div>
      <button class="start" id="start">开始</button>
    </div>
  </section>

  <!-- 学习 -->
  <section class="study" id="study">
    <div class="bar">
      <span class="no" id="no">1 / 20</span>
      <span class="sp"></span>
      <span class="cnt">
        <span class="g">认识 <b id="cG">0</b></span>
        <span class="o">模糊 <b id="cO">0</b></span>
        <span class="r">不认识 <b id="cR">0</b></span>
      </span>
    </div>
    <div class="track"><i id="prog"></i></div>

    <div class="card" id="card">
      <div class="ctag" id="ctag">中文语境</div>
      <div class="cface front" id="front"></div>
      <div class="cface back" id="back" hidden></div>
    </div>

    <div class="grade" id="grade" hidden>
      <button class="g1" data-g="1">不认识<span>再来一次</span></button>
      <button class="g2" data-g="2">模糊<span>稍后再出</span></button>
      <button class="g3" data-g="3">认识<span>过关</span></button>
    </div>
  </section>

  <!-- 结果 -->
  <section class="result" id="result">
    <div class="rtop">
      <div class="big" id="rscore">0<small>%</small></div>
      <p class="rlabel" id="rlabel"></p>
    </div>
    <div class="stats">
      <div class="stat g"><b id="sG">0</b><span>认识</span></div>
      <div class="stat o"><b id="sO">0</b><span>模糊</span></div>
      <div class="stat r"><b id="sR">0</b><span>不认识</span></div>
    </div>
    <div class="ractions">
      <button class="primary" id="again">重新设置</button>
      <button id="retry" style="display:none"></button>
    </div>
    <div class="review" id="review"></div>
  </section>

  <footer>
    <p><b>卡片来源</b>：Anki 牌组 <code>deck:Cet4</code> 中 FSRS 难度 ≥80% 的 951 个词，按四级词频排序。</p>
    <p><b>操作</b>：点卡片或按 <code>空格</code> 翻面；翻面后按 <code>1</code> 不认识 / <code>2</code> 模糊 / <code>3</code> 认识。</p>
    <p><b>重排规则</b>：「不认识」会在队列尾部重新插入，「模糊」会放到更后面；只有「认识」算过关。</p>
    <p>页面自包含、无外部依赖，可离线使用；深色模式跟随系统。</p>
  </footer>
</div>

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ALL = DATA.cards;
const ranked = ALL.filter(c=>c.rank).sort((a,b)=>a.rank-b.rank);
ranked.forEach((c,i)=>c._seq=i+1);
const bySeq = (lo,hi)=>ranked.filter(c=>c._seq>=lo&&c._seq<=hi);

const SCOPES = {
  all: ()=>ALL.slice(),
  s1:  ()=>bySeq(1,100),
  s2:  ()=>bySeq(101,200),
  s3:  ()=>bySeq(201,300),
  s4:  ()=>bySeq(301,500),
  s5:  ()=>bySeq(501,802),
  none:()=>ALL.filter(c=>!c.rank),
  hard:()=>ALL.slice().sort((a,b)=>b.d-a.d).slice(0,200),
};

let cfg = { scope:'all', count:20, side:'cn' };
let queue = [], pos = 0, flipped = false;
let stat = { g:0, o:0, r:0 };
let seen = new Set();        // 已过关
let weak = [];               // 评级 <=2 的词，用于结果页回顾

const pool = ()=>SCOPES[cfg.scope]();
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

function pickSide(){ return cfg.side==='mix' ? (Math.random()<.5?'cn':'en') : cfg.side; }

function start(list){
  const n = cfg.count === 0 ? list.length : Math.min(cfg.count, list.length);
  queue = shuffle(list).slice(0, n).map(c=>({c, side:pickSide(), reps:0}));
  pos = 0; stat = {g:0,o:0,r:0}; seen = new Set(); weak = [];
  $('#setup').style.display='none';
  $('#result').classList.remove('on');
  $('#study').classList.add('on');
  updateCounts();
  render();
}

function updateCounts(){
  $('#cG').textContent = stat.g;
  $('#cO').textContent = stat.o;
  $('#cR').textContent = stat.r;
}

function render(){
  if (pos >= queue.length){ finish(); return; }
  const item = queue[pos], c = item.c;
  flipped = false;
  $('#card').classList.remove('flipped');
  $('#back').hidden = true;
  $('#front').hidden = false;
  $('#grade').hidden = true;
  $('#no').textContent = `${pos+1} / ${queue.length}`;
  $('#prog').style.width = (pos / queue.length * 100) + '%';

  const isCn = item.side === 'cn';
  $('#ctag').textContent = isCn ? '中文语境' : '英文单词';
  $('#ctag').className = 'ctag' + (isCn ? ' blue' : '');

  if (isCn && c.ctx){
    const re = new RegExp('(' + c.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\w*)','i');
    $('#front').innerHTML = `<p class="zh">${esc(c.ctx).replace(re,'<span class="blank">?</span>')}</p>
      <p class="reveal">点击卡片或按 <kbd>空格</kbd> 看答案</p>`;
  } else if (isCn){
    $('#front').innerHTML = `<p class="zh" style="text-align:center">${esc(c.def)}</p>
      <p class="reveal">点击卡片或按 <kbd>空格</kbd> 看答案</p>`;
  } else {
    $('#front').innerHTML = `<p class="word">${esc(c.w)}</p>
      ${c.pos?`<p class="pos">${esc(c.pos)}</p>`:''}
      <p class="reveal">点击卡片或按 <kbd>空格</kbd> 看答案</p>`;
  }
}

function flip(){
  if (flipped) return;
  flipped = true;
  const c = queue[pos].c;
  $('#card').classList.add('flipped');
  $('#front').hidden = true;
  $('#back').hidden = false;

  const re = new RegExp('(' + c.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\w*)','i');
  $('#back').innerHTML = `
    <p class="w">${esc(c.w)}${c.pos?`<span class="pos">${esc(c.pos)}</span>`:''}</p>
    <p class="def">${esc(c.def||'')}</p>
    ${c.memo?`<div class="block memo"><span class="lbl">记忆诀窍</span>${esc(c.memo)}</div>`:''}
    ${c.ctx?`<div class="block ctx"><span class="lbl">中文语境</span>${esc(c.ctx).replace(re,'<mark>$1</mark>')}</div>`:''}
    <div class="meta">
      ${c.rank?`<span>四级词频 <b>#${c.rank}</b></span>`:'<span>无词频</span>'}
      <span>难度 <b>${c.d}%</b></span>
    </div>`;
  $('#grade').hidden = false;
}

function grade(g){
  const item = queue[pos];
  const c = item.c;
  if (g === 3){
    if (item.reps === 0){ stat.g++; seen.add(c.w); }
    // 已到过的词再答对，不重复计分
    pos++;
  } else if (g === 2){
    if (item.reps === 0) stat.o++;
    item.reps++;
    item.side = pickSide();
    // 模糊：放到 3 张之后
    const insertAt = Math.min(queue.length, pos + 4);
    queue.splice(pos, 1);
    queue.splice(insertAt, 0, item);
    if (!weak.includes(c)) weak.push(c);
  } else {
    if (item.reps === 0) stat.r++;
    item.reps++;
    item.side = pickSide();
    // 不认识：放到队尾
    queue.splice(pos, 1);
    queue.push(item);
    if (!weak.includes(c)) weak.push(c);
  }
  updateCounts();
  render();
}

function finish(){
  $('#study').classList.remove('on');
  $('#result').classList.add('on');
  const total = stat.g + stat.o + stat.r;
  const pct = total ? Math.round(stat.g / total * 100) : 0;
  $('#rscore').innerHTML = `${pct}<small>%</small>`;
  $('#sG').textContent = stat.g;
  $('#sO').textContent = stat.o;
  $('#sR').textContent = stat.r;
  $('#rlabel').textContent = pct >= 85 ? '这一轮很稳，剩下的可以放一放'
    : pct >= 60 ? '大体掌握，把「不认识」的再过一轮'
    : '生词还比较多，建议只练没过的';
  const wl = weak.slice();
  $('#retry').style.display = wl.length ? 'block' : 'none';
  $('#retry').textContent = `只练没过的（${wl.length}）`;
  $('#review').innerHTML = wl.length ? '<h2>需要再看一遍</h2>' + wl.map(c=>{
    const re = new RegExp('(' + c.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\w*)','i');
    return `<div class="rv">
      <div><span class="w">${esc(c.w)}</span>${c.pos?`<span class="pos">${esc(c.pos)}</span>`:''}</div>
      <p class="d">${esc(c.def||'')}</p>
      ${c.ctx?`<p class="c">${esc(c.ctx).replace(re,'<mark>$1</mark>')}</p>`:''}
    </div>`;
  }).join('') : '';
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---- 交互 ---- */
$('#card').addEventListener('click', flip);
$('#grade').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  grade(+b.dataset.g);
});
document.addEventListener('keydown', e=>{
  if (!$('#study').classList.contains('on')) return;
  if (e.code === 'Space' && !flipped){ e.preventDefault(); flip(); return; }
  if (flipped && ['1','2','3'].includes(e.key)){ e.preventDefault(); grade(+e.key); }
});

function bindGroup(sel, key, cb){
  $(sel).addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    [...$(sel).children].forEach(x=>x.classList.toggle('on', x===b));
    cfg[key] = key === 'count' ? +b.dataset.v : b.dataset.v;
    cb && cb();
  });
}
bindGroup('#scope','scope',()=>{ $('#poolhint').textContent = `可选词池：${pool().length} 个`; });
bindGroup('#count','count');
bindGroup('#side','side');

$('#start').addEventListener('click', ()=>start(pool()));
$('#again').addEventListener('click', ()=>{
  $('#result').classList.remove('on');
  $('#setup').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
});
$('#retry').addEventListener('click', ()=>{
  if (!weak.length) return;
  const keep = cfg.count;
  cfg.count = 0;
  start(weak.slice());
  cfg.count = keep;
});

$('#poolhint').textContent = `可选词池：${pool().length} 个`;
$('#lead').textContent = `从 ${ALL.length} 个难度 ≥80% 的四级词中抽卡，翻面看答案，自评掌握度。不认识的卡片会重新排队，直到这轮过关。`;
</script>
</body>
</html>
